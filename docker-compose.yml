services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./data:/data"]
    environment:
      DATA_DIR: /data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [frontend]
